<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='black'><rect width='24' height='24' rx='6'/><text x='4' y='17' fill='%23bbf451' font-family='monospace' font-weight='bold' font-size='14'>&gt;_</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ashish Jain | Full-Stack & AI Systems Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          const stored = localStorage.getItem("theme");
          const prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          const theme = stored ? stored : prefersDark ? "dark" : "light";
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
            document.querySelector('meta[name="color-scheme"]').content =
              "dark";
          } else {
            document.documentElement.classList.remove("dark");
            document.querySelector('meta[name="color-scheme"]').content =
              "light";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body
    class="h-full antialiased font-['Plus_Jakarta_Sans',sans-serif] transition-colors duration-200"
  >
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
